<mat-sidenav-container class="shell-container">
  <mat-sidenav mode="side" opened class="shell-sidenav">
    <div class="brand">
      <span class="logo-badge">
        <mat-icon>two_wheeler</mat-icon>
      </span>
      <span class="brand-name">Admin Portal</span>
    </div>

    <div class="menu-label">Menu</div>

    <mat-nav-list>
      <a mat-list-item routerLink="/dashboard" routerLinkActive="active-link">
        <mat-icon matListItemIcon>dashboard</mat-icon>
        <span matListItemTitle>Dashboard</span>
      </a>

      <mat-accordion multi>
        @for (group of navGroups(); track group.label) {
          <mat-expansion-panel class="nav-group">
            <mat-expansion-panel-header>
              <mat-panel-title>
                <mat-icon class="group-icon">{{ group.icon }}</mat-icon>
                {{ group.label }}
              </mat-panel-title>
            </mat-expansion-panel-header>

            <mat-nav-list class="nav-group-children">
              @for (child of group.children; track child.path) {
                <a mat-list-item [routerLink]="'/' + child.path" routerLinkActive="active-link">
                  <span matListItemTitle>{{ child.label }}</span>
                </a>
              }
            </mat-nav-list>
          </mat-expansion-panel>
        }
      </mat-accordion>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar class="shell-toolbar">
      <span class="spacer"></span>
      <span class="admin-name">{{ auth.adminName() }}</span>
      <span class="role-badge">{{ roleLabels[auth.currentRole()!] }}</span>
      <button mat-icon-button (click)="logout()" aria-label="Log out">
        <mat-icon>logout</mat-icon>
      </button>
    </mat-toolbar>

    <div class="shell-body">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
