<h2 mat-dialog-title>{{ data.title }}</h2>
<mat-dialog-content>
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>{{ data.label }}</mat-label>
    <textarea
      matInput
      rows="4"
      name="reason"
      [ngModel]="reason()"
      (ngModelChange)="reason.set($event)"
    ></textarea>
  </mat-form-field>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">Cancel</button>
  <button mat-flat-button color="primary" [disabled]="!reason().trim()" (click)="confirm()">
    {{ data.confirmText }}
  </button>
</mat-dialog-actions>
