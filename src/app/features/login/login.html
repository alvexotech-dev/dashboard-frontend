<div class="login-page">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>Admin Portal</mat-card-title>
      <mat-card-subtitle>Bike Service Booking Platform</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form (ngSubmit)="submit()" #loginForm="ngForm">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input
            matInput
            type="email"
            name="email"
            autocomplete="username"
            [ngModel]="email()"
            (ngModelChange)="email.set($event)"
            placeholder="you@alvexo.com"
          />
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <input
            matInput
            type="password"
            name="password"
            autocomplete="current-password"
            [ngModel]="password()"
            (ngModelChange)="password.set($event)"
          />
        </mat-form-field>

        @if (error()) {
          <div class="error-banner">
            <mat-icon>error_outline</mat-icon>
            <span>{{ error() }}</span>
          </div>
        }

        <button mat-flat-button color="primary" type="submit" class="full-width" [disabled]="loading()">
          @if (loading()) {
            <mat-spinner diameter="20"></mat-spinner>
          } @else {
            Sign in
          }
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
